name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push to a pull request cancels its previous run; runs on main and
  # on tags all finish.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.julia }}, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The oldest Julia the package supports, and the latest release.
        julia: ['1.10', '1']
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}
          arch: ${{ runner.arch }}
      - uses: julia-actions/cache@v2
      # The tddlog command of the release the package wraps, whose answers
      # the tests compare with the library's.
      # On Windows the archive is a zip, and the path is written with forward
      # slashes, which the tests' shell_split keeps.
      - name: Install the tddlog command
        shell: bash
        run: |
          set -eu
          version=$(sed -n 's/^const TDDLOG_VERSION = v"\(.*\)"$/\1/p' src/Tddlog.jl)
          ext=tar.gz
          command=tddlog
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) target=x86_64-unknown-linux-gnu ;;
            Linux-aarch64) target=aarch64-unknown-linux-gnu ;;
            Darwin-arm64) target=aarch64-apple-darwin ;;
            Darwin-x86_64) target=x86_64-apple-darwin ;;
            MINGW*-x86_64) target=x86_64-pc-windows-msvc ext=zip command=tddlog.exe ;;
          esac
          name=tddlog-v$version-$target
          cd "$RUNNER_TEMP"
          base=https://github.com/Tractables/tddlog/releases/download/v$version
          curl -sSfLO "$base/$name.$ext"
          curl -sSfLO "$base/$name.$ext.sha256"
          if command -v sha256sum > /dev/null; then
            sha256sum -c "$name.$ext.sha256"
          else
            shasum -a 256 -c "$name.$ext.sha256"
          fi
          if [ "$ext" = zip ]; then
            7z x -y "$name.zip" > /dev/null
          else
            tar xzf "$name.tar.gz"
          fi
          dir=$PWD/$name
          if command -v cygpath > /dev/null; then dir=$(cygpath -m "$dir"); fi
          echo "TDDLOG_COMMAND=$dir/$command" >> "$GITHUB_ENV"
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
