# Tags a release and makes a GitHub release for each version registered in
# Julia's General registry. JuliaTagBot triggers it with a comment on an
# issue; workflow_dispatch runs it by hand.
name: TagBot
on:
  issue_comment:
    types:
      - created
  workflow_dispatch:
    inputs:
      lookback:
        description: "[DEPRECATED] No longer has any effect"
        default: "3"
jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@87cc4cc2b4639f6c743f5772f376a32914060732 # v1.25.15
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # GITHUB_TOKEN cannot tag a commit that changes a workflow file, and
          # its tags trigger no other workflow. A deploy key with write
          # access, stored as the secret DOCUMENTER_KEY, tags such a commit
          # (its GitHub release is then made by hand) and triggers CI on the
          # tag. Without the secret, TagBot uses GITHUB_TOKEN alone.
          ssh: ${{ secrets.DOCUMENTER_KEY }}
